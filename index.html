<title>每天20词 · 六年级英语单词训练营</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
 background:linear-gradient(165deg,#eef4ff 0%,#f6f3ff 45%,#fff5f0 100%);
 background-attachment:fixed;color:#1e2a47;min-height:100vh;font-size:16px;line-height:1.6;
}
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 96px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 10px}
.brand{font-size:19px;font-weight:800;letter-spacing:.5px;color:#3b4a6b}
.brand span{background:linear-gradient(90deg,#5b7cfa,#9a6cf7);-webkit-background-clip:text;background-clip:text;color:transparent}
.topinfo{font-size:13px;color:#7d89a6;text-align:right;line-height:1.35}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 26px rgba(74,95,160,.10);margin-bottom:14px}
.card.tight{padding:14px}
.hero{background:linear-gradient(135deg,#5b7cfa,#8f6cf6 70%,#a77cf4);color:#fff;border-radius:22px;padding:20px;box-shadow:0 12px 26px rgba(91,124,250,.28);margin-bottom:16px}
.hero h1{margin:0 0 4px;font-size:20px;font-weight:800}
.hero .sub{font-size:13px;opacity:.9}
.hero .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:6px 13px;font-size:13px}
.hero .big{font-size:26px;font-weight:800;display:block;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mini{background:#fff;border-radius:16px;padding:12px 10px;text-align:center;box-shadow:0 6px 18px rgba(74,95,160,.08)}
.mini b{display:block;font-size:22px;color:#4f6bea}
.mini span{font-size:12px;color:#7d89a6}
.mini.done b{color:#2fb87a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;
 border-radius:999px;padding:13px 20px;font-size:16px;font-weight:700;color:#fff;
 background:linear-gradient(135deg,#5b7cfa,#8f6cf6);box-shadow:0 8px 18px rgba(91,124,250,.28);
 transition:transform .12s ease,box-shadow .12s ease;font-family:inherit}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.wide{width:100%}
.btn.ghost{background:#fff;color:#4a5b8c;box-shadow:0 4px 14px rgba(74,95,160,.10);border:1px solid #e2e8f7}
.btn.good{background:linear-gradient(135deg,#39c07f,#2ea86e);box-shadow:0 8px 18px rgba(57,192,127,.28)}
.btn.bad{background:linear-gradient(135deg,#ff9a6b,#f9735f);box-shadow:0 8px 18px rgba(249,115,95,.26)}
.btn.sm{padding:9px 15px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
.tagrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tag{background:#eef2ff;color:#4f6bea;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.tag.rev{background:#fff0e6;color:#e07a3a}
.tag.quiz{background:#eaf9f1;color:#28a06b}
.topic{font-size:12px;color:#9aa5be}
.wordline{display:flex;align-items:center;gap:12px;justify-content:center;margin:10px 0 2px;flex-wrap:wrap}
.word{font-size:38px;font-weight:800;letter-spacing:.5px;color:#243255;word-break:break-word;text-align:center}
.spk{border:none;background:#eef2ff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer}
.spk:active{transform:scale(.95)}
.phon{text-align:center;color:#8892ab;font-size:15px;margin-bottom:6px}
.reveal{margin-top:14px;border-top:1px dashed #e4e9f5;padding-top:14px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cn{font-size:22px;font-weight:700;color:#2f9a68;text-align:center}
.pos{text-align:center;font-size:13px;color:#9aa5be;margin-top:2px}
.ex{margin-top:12px;font-size:16px;color:#35405c;background:#f7f9ff;border-radius:14px;padding:12px;border-left:4px solid #c7d4fb}
.ex em{color:#4f6bea;font-style:normal;font-weight:700}
.excn{font-size:14px;color:#8792ac;margin-top:6px}
.hint{color:#9aa5be;font-size:13px;text-align:center;margin-top:6px}
.bar{height:8px;background:#eef1f9;border-radius:999px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#5b7cfa,#9a6cf7);transition:width .3s}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #e4e9f5;border-radius:14px;
 padding:13px 16px;margin-bottom:10px;font-size:16px;cursor:pointer;font-family:inherit;color:#28324d;transition:.15s}
.opt:hover{border-color:#c7d4fb;background:#fafbff}
.opt.ok{border-color:#39c07f;background:#eafaf2;color:#1f7a51;font-weight:700}
.opt.no{border-color:#f9735f;background:#fff0ed;color:#c0392b}
.opt:disabled{cursor:default}
.option-en{font-weight:700}
.qtitle{font-size:14px;color:#7d89a6;margin-bottom:12px}
.qmain{font-size:26px;font-weight:800;text-align:center;margin:8px 0 4px;color:#243255}
input.spell{width:100%;padding:14px 16px;font-size:20px;border:1.5px solid #e4e9f5;border-radius:14px;
 font-family:inherit;outline:none;text-align:center;letter-spacing:1px;background:#fff}
input.spell:focus{border-color:#5b7cfa;box-shadow:0 0 0 3px rgba(91,124,250,.12)}
textarea.spellarea{width:100%;min-height:86px;padding:13px 15px;font-size:17px;line-height:1.5;border:1.5px solid #e4e9f5;border-radius:14px;font-family:inherit;outline:none;resize:vertical;background:#fff}
textarea.spellarea:focus{border-color:#5b7cfa;box-shadow:0 0 0 3px rgba(91,124,250,.12)}
.fb{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:15px}
.fb.ok{background:#eafaf2;color:#1f7a51}
.fb.no{background:#fff1ee;color:#c0392b}
.wronglist{margin-top:6px}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #f1f4fb}
.wrow:last-child{border-bottom:none}
.wleft b{font-size:17px;color:#243255}
.wleft span{display:block;font-size:13px;color:#8792ac}
.empty{text-align:center;color:#9aa5be;padding:26px 10px;font-size:15px}
.warn{background:#fff6e5;color:#a06000;border:1px solid #ffe2b0;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.55;margin-bottom:14px}
.tag.unit{background:#f3ecff;color:#7a4fd0}
.ucard{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 8px 20px rgba(74,95,160,.09);margin-bottom:12px}
.ucard.cur{border-left:5px solid #7a4fd0}
.uhead{font-size:16px;color:#3b4a6b}
.uhead b{color:#4f6bea}
.uhead .ut{font-weight:700}
.ucn{font-size:13px;color:#8f9ab3;margin-top:2px}
.ubtn{display:flex;gap:8px;margin-top:10px}
.ubtn .btn{flex:1;padding:10px 0;font-size:13px}
@media (max-width:660px){ .kb{display:none!important} .word{font-size:32px} .cn{font-size:20px} }
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(74,95,160,.08)}
.stat b{font-size:24px;color:#4f6bea;display:block}
.stat span{font-size:12px;color:#7d89a6}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
.hcell{aspect-ratio:1;border-radius:8px;background:#eef1f9;display:flex;align-items:center;justify-content:center;font-size:10px;color:#9aa5be}
.hcell.l1{background:#d5e0ff;color:#4a5b8c}
.hcell.l2{background:#a9c0fd;color:#334}
.hcell.l3{background:#7b98fa;color:#fff}
.hcell.today{outline:2px solid #f5a623;outline-offset:1px}
.packlist .pk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f4fb;font-size:14px}
.packlist .pk:last-child{border-bottom:none}
.pk .nm{flex:0 0 130px;color:#334;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .pb{flex:1;height:7px;background:#eef1f9;border-radius:999px;overflow:hidden}
.pk .pb i{display:block;height:100%;background:linear-gradient(90deg,#5b7cfa,#9a6cf7)}
.pk .n{flex:0 0 54px;text-align:right;color:#8892ab;font-size:13px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #f1f4fb}
.srow:last-child{border-bottom:none}
.srow .lb{font-size:15px;color:#334;font-weight:600}
.srow .ds{font-size:12px;color:#9aa5be;font-weight:400;display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid #e4e9f5;background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit;color:#4a5b8c}
.seg button.on{background:#eef2ff;border-color:#b9c8fb;color:#3f57c9;font-weight:700}
.switch{width:52px;height:30px;border-radius:999px;background:#dde3f1;border:none;position:relative;cursor:pointer;transition:.2s}
.switch.on{background:#39c07f}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.switch.on i{left:25px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
 border-top:1px solid #e9edf7;display:flex;justify-content:space-around;padding:8px 6px 10px;z-index:50}
.nav a{flex:1;text-align:center;font-size:12px;color:#8b96b0;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav a .ic{font-size:20px;line-height:1}
.nav a.on{color:#4f6bea;font-weight:800}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#28324d;color:#fff;
 padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.footnote{text-align:center;color:#a7b1c6;font-size:12px;padding:12px 0 4px}
.bigresult{text-align:center;padding:8px 0 4px}
.bigresult .num{font-size:44px;font-weight:800;background:linear-gradient(90deg,#5b7cfa,#9a6cf7);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>

    try{ a.load(); }catch(e){}
    a.onerror=fail;
    a.onended=end;
    var p=a.play();
    if(p&&p.catch){ p.catch(function(){ fail(); }); }
  }catch(e){ fail(); }
}
/* 单词用有道（词典音质好），句子用百度（有道不支持长句，会返回 500） */
function ttsList(t){
  var enc=encodeURIComponent(t);
  var yd='https://dict.youdao.com/dictvoice?audio='+enc+'&type=2';
  var bd='https://fanyi.baidu.com/gettts?lan=en&text='+enc+'&spd=3&source=web';
  return isSent(t)?[bd,yd]:[yd,bd];
}
function isSent(t){ return (/\s/.test(t)||t.length>15); }
var _BW=null;
/* 整句接口都拿不到音频时，退化成逐词朗读（词典单词接口在手机上最稳） */
function speakByWords(text){
  var ws=String(text).replace(/[^A-Za-z'\- ]+/g,' ').split(/\s+/).filter(function(x){return x;});
  if(!ws.length||ws.length>14)return false;
  var seq={}; _BW=seq;
  toast('整句朗读走不通，改为逐词朗读');
  var i=0;
  function step(){
    if(_BW!==seq)return;
    if(i>=ws.length){ _BW=null; return; }
    var w=ws[i++];
    var yd='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(w)+'&type=2';
    var bd='https://fanyi.baidu.com/gettts?lan=en&text='+encodeURIComponent(w)+'&spd=3&source=web';
    playAudio(yd,function(){ playAudio(bd,function(){ setTimeout(step,60); },function(){ setTimeout(step,140); }); },function(){ setTimeout(step,140); });
  }
  step();
  return true;
}
function onlineSpeak(txt){
  var t=(txt||'').replace(/[.。！？!?]+$/,'').trim();
  if(!t)return;
  _BW=null;
  var list=ttsList(t),i=0;
  function next(){
    if(i>=list.length){
      if(isSent(t)&&speakByWords(t))return;
      toast('发音加载失败，请检查网络'); return;
    }
    playAudio(list[i++],next);
  }
  next();
}
function speakText(txt,rate){
  if(!DB.speak)return;
  _BW=null;
  if(voiceOK){
    try{
      var vs=window.speechSynthesis.getVoices();
      if(vs&&vs.length){
        window.speechSynthesis.cancel();
        var u=new SpeechSynthesisUtterance(txt);
        u.lang='en-US';u.rate=rate||0.86;u.pitch=1;
        var pick=null;
        for(var i=0;i<vs.length;i++){if((vs[i].lang||'').toLowerCase().indexOf('en-us')===0){pick=vs[i];break;}}
        if(!pick){for(var j=0;j<vs.length;j++){if((vs[j].lang||'').toLowerCase().indexOf('en')===0){pick=vs[j];break;}}}
        if(pick)u.voice=pick;
        u.onerror=function(){onlineSpeak(txt);};
        window.speechSynthesis.speak(u);
        setTimeout(function(){
          try{
            if(!window.speechSynthesis.speaking&&!window.speechSynthesis.pending)onlineSpeak(txt);
          }catch(e){}
        },800);
        return;
      }
    }catch(e){}
  }
  onlineSpeak(txt);
}
function speakCurrent(){
  if(!S)return;
  var key=S.stages[S.stage].keys[S.idx];
  if(!key)return;
  if(S.flipped&&WMAP[key]){speakText(WMAP[key][4]||key,0.82);}

/* ---------- 计划 ---------- */
function buildPlan(){
  var d=todayStr();
  var plan={date:d,news:[],rev:[],posNew:0,posRev:0,newDone:false,revDone:false,quizDone:false,rightN:0,totalN:0,nextPtr:DB.ptr};
  var need=DB.daily,p=DB.ptr,picked=0;
  while(picked<need && p<WORDS.length){
    var k=WORDS[p][0].toLowerCase();
    if(!DB.words[k]){plan.news.push(k);picked++;}
    p++;
  }
  plan.nextPtr=p;
  var arr=[],t=todayStr();
  for(var key in DB.words){
    var r=DB.words[key];
    if(r && r.next && r.next<=t && r.s<7 && arr.length<40)arr.push(key);
  }
  arr.sort(function(a,b){
    var x=DB.words[a].next||'9999',y=DB.words[b].next||'9999';
    if(x<y)return -1;if(x>y)return 1;return 0;
  });
  plan.rev=arr;
  return plan;
}
function getPlan(){
  var d=todayStr();
  if(DB.plans[d])return DB.plans[d];
  return buildPlan();
}
function ensurePlan(){
  var d=todayStr();
  if(!DB.plans[d]){
    var p=buildPlan();
    DB.plans[d]=p;
    DB.ptr=p.nextPtr;
    save();
  }
  return DB.plans[d];
}

/* ---------- 记分 ---------- */
function applyResult(key,ok){
  var r=DB.words[key];
  if(!r){r={s:0,n:0,ok:0,bad:0,next:null,last:null};}
  var t=todayStr();
  r.n++;
  if(ok){
    r.ok++;r.s=Math.min(6,r.s+1);
    if(r.bad>0)r.bad--;
    r.next=addDays(t,GAP[r.s]);
  }else{
    r.bad++;r.s=(r.s<=1?0:r.s-1);
    r.next=addDays(t,1);
  }
  r.last=t;
  DB.words[key]=r;
  save();
}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function allKeys(){var a=[];for(var k in WMAP)a.push(k);return a;}
function packMates(key){
  var i0=WIDX[key], s=Math.floor(i0/20)*20, e=Math.min(WORDS.length,s+20), a=[];
  for(var i=s;i<e;i++){var k=WORDS[i][0].toLowerCase();if(k!==key)a.push(k);}
  return a;
}
function distract(key,need,field){
  var pool=packMates(key).slice();
  var extra=allKeys();
  var used=[WMAP[key][field]];
  var out=[];
  while(out.length<need){
    var cand=null;
    if(pool.length)cand=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    else {
      var r=extra[Math.floor(Math.random()*extra.length)];
      if(!r)break;
      cand=r;
    }
    if(!cand)break;
    if(used.indexOf(WMAP[cand][field])>=0)continue;
    used.push(WMAP[cand][field]);out.push(cand);
  }
  return out;
}
function buildQuiz(keys,mode){
  keys=keys.filter(function(k){return !!WMAP[k];});
  if(!keys.length)return [];
  var uniq=[];for(var i=0;i<keys.length;i++){if(uniq.indexOf(keys[i])<0)uniq.push(keys[i]);}
  shuffle(uniq);
  var n=Math.min(12,uniq.length);
  if(mode==='wrong')n=Math.min(12,uniq.length);
  else if(uniq.length<12)n=uniq.length;
  var chosen=uniq.slice(0,n), qs=[];
  for(var j=0;j<chosen.length;j++){
    var key=chosen[j], w=WMAP[key], type=j%3;
    var q={key:key,type:type,en:w[0],cn:w[3],pos:w[2],phon:w[1],ex:w[4],excn:w[5]};
    if(type===2){Q=null;}
    if(type===0){
      q.prompt=w[0];
      var dis=distract(key,3,3);
      q.options=[w[3]+' '+w[2]].concat(dis.map(function(k){return WMAP[k][3]+' '+WMAP[k][2];}));
      q.correct=0;
      var mix=[];for(var m=0;m<q.options.length;m++)mix.push(m);
      shuffle(mix);
      q.options=mix.map(function(i2){return q.options[i2];});
      q.correct=mix.indexOf(0);
    }else if(type===1){
      q.prompt=w[3]+'（'+w[2]+'）';
      var dis2=distract(key,3,0);
      q.options=[w[0]].concat(dis2.map(function(k){return WMAP[k][0];}));
      q.correct=0;
      var mix2=[];for(var m2=0;m2<q.options.length;m2++)mix2.push(m2);
      shuffle(mix2);
      q.options=mix2.map(function(i3){return q.options[i3];});
      q.correct=mix2.indexOf(0);
    }else{
      q.prompt=null;
      q.blank=makeBlank(w[4]||'',w[0]);
    }
    qs.push(q);
  }
  return qs;
}
function makeBlank(ex,word){
  try{
    var re=new RegExp('\\b'+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
    if(re.test(ex))return ex.replace(re,'______');
  }catch(e){}
  return '';
}

/* ---------- 听写 ---------- */
function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function sameSentence(a,b){
  function ws(s){
    return (s||'').toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(function(x){return x.length>0;});
  }
  var A=ws(a),B=ws(b);
  if(!A.length||!B.length)return false;
  var bad=Math.abs(A.length-B.length);
  var n=Math.min(A.length,B.length);
  for(var i=0;i<n;i++){ if(A[i]!==B[i])bad++; }
  var allow=Math.max(1,Math.floor(B.length*0.25));
  return bad<=allow;
}
function dictPool(){
  var plan=ensurePlan();
  var keys=plan.news.slice(0,plan.posNew).concat(plan.rev.slice(0,plan.posRev));
  var all=Object.keys(DB.words);
  for(var i=0;i<all.length;i++){ if(DB.words[all[i]].last===todayStr()&&keys.indexOf(all[i])<0)keys.push(all[i]); }
  var uniq=[];
  for(var j=0;j<keys.length;j++){ if(uniq.indexOf(keys[j])<0&&WMAP[keys[j]])uniq.push(keys[j]); }
  if(!uniq.length)uniq=all.filter(function(k){return !!WMAP[k];});
  return uniq;
}
function startDictate(mode,poolKeys,src){
  var pool=(poolKeys&&poolKeys.length)?poolKeys.filter(function(k){return !!WMAP[k];}):dictPool();
  if(!pool.length){toast('先学几个单词再来听写');return;}
  var list=pool.slice();
  shuffle(list);
  if(mode==='sentence'){ list=list.filter(function(k){return WMAP[k]&&WMAP[k][4];}); }
  if(!list.length){toast('这组词还没有例句，先做单词听写吧');return;}
  var n=Math.min(mode==='sentence'?8:10,list.length);
  DT={mode:mode,list:list.slice(0,n),i:0,right:0,wrongKeys:[],answered:false,typing:'',src:src||null,pool:pool.slice()};
  view='dict';render();
  setTimeout(function(){dictPlay();},120);
}
function dictPlay(){
  if(!DT)return;
  var k=DT.list[DT.i]; if(!k)return;
  var w=WMAP[k]; if(!w)return;
  if(DT.mode==='sentence')speakText(w[4],0.74);
  else speakText(w[0],0.8);
}

  }

function dictSubmit(){

  var b=bookById(id);if(!b)return;
  var u=b.units[ui];if(!u)return;
  var keys=unitKeys(u);
  if(!keys.length){toast('这一单元还没有词表');return;}
  DB.unit={id:id,u:ui};save();
  S={stages:[{type:'unit',keys:keys}],stage:0,idx:0,flipped:false,know:0,no:0,topic:b.name+' '+u.u,t:'',unitRef:{id:id,u:ui,label:u.u+' '+u.t}};
  view='study';render();
  if(DB.speak)setTimeout(function(){speakText(keys[0],0.86);},350);
}
function startUnitQuiz(id,ui){
  var b=bookById(id);if(!b)return;
  var u=b.units[ui];if(!u)return;
  var keys=unitKeys(u);
  if(keys.length<2){toast('这一单元词太少，先去学一遍');return;}
  var qs=buildQuiz(keys,'mix');
  if(!qs.length){toast('这一单元还没有词表');return;}
  DB.unit={id:id,u:ui};save();
  Q={list:qs,i:0,right:0,wrongKeys:[],answered:false,chosen:-1,typing:'',mode:'unit',src:{id:id,u:ui}};
  view='quiz';render();
}
function startUnitDictate(id,ui,mode){
  var b=bookById(id);if(!b)return;
  var u=b.units[ui];if(!u)return;
  var keys=unitKeys(u);
  if(!keys.length){toast('这一单元还没有词表');return;}
  DB.unit={id:id,u:ui};save();
  startDictate(mode,keys,{id:id,u:ui});
}

/* ---------- 统计 ---------- */
function statHTML(){
  var learned=Object.keys(DB.words).length;
  var mastered=0,learning=0;
  for(var k in DB.words){if(DB.words[k].s>=4)mastered++;else learning++;}
  var total=WORDS.length;
  var streak=calcStreak();
  var days=Object.keys(DB.logs).length;
  var todayN=DB.words&&Object.keys(DB.words).filter(function(k2){return DB.words[k2].last===todayStr();}).length;
  var h='';
  h+='<div class="statgrid">';
  h+='<div class="stat"><b>'+learned+'</b><span>已学单词（共 '+total+'）</span></div>';
  h+='<div class="stat"><b>'+mastered+'</b><span>已掌握（能熟练想起）</span></div>';
  h+='<div class="stat"><b>'+streak+'</b><span>连续打卡天数</span></div>';
  h+='<div class="stat"><b>'+days+'</b><span>累计学习天数</span></div>';
  h+='</div>';

  h+='<div class="card"><div class="tagrow"><span class="tag">最近 30 天</span><span class="topic">颜色越深，当天完成得越好</span></div><div class="heat">';
  for(var i=29;i>=0;i--){
    var d=addDays(todayStr(),-i);
    var l=DB.logs[d];
    var cls='hcell';
    if(l&&l.newDone)cls+=' l3';
    else if(l&&(l.revDone||l.quizDone))cls+=' l2';
    else if(l)cls+=' l1';
    if(i===0)cls+=' today';
    h+='<div class="'+cls+'" title="'+d+'">'+parseD(d).getDate()+'</div>';
  }
  h+='</div></div>';

  h+='<div class="card"><div class="tagrow"><span class="tag">'+TOPICS.length+' 个词包进度</span><span class="topic">每天一个词包</span></div><div class="packlist">';
  for(var p=0;p<30;p++){
    var s=p*20,e=Math.min(WORDS.length,s+20),c=0;
    for(var j=s;j<e;j++){var kk=WORDS[j][0].toLowerCase();if(DB.words[kk])c++;}
    var pct=Math.round(c/((e-s)||1)*100);
    h+='<div class="pk"><span class="nm">'+(p+1)+'. '+(TOPICS[p]||'')+'</span><span class="pb"><i style="width:'+pct+'%"></i></span><span class="n">'+c+'/'+(e-s)+'</span></div>';
  }
  h+='</div></div>';
  return h;
}

/* ---------- 设置 ---------- */
function setHTML(){
  var h='<div class="card">';
  h+='<div class="srow"><div class="lb">每天新学词数<span class="ds">建议 20 个，时间紧可以调到 15</span></div><div class="seg">';
  var opts=[10,15,20,25,30];
  for(var i=0;i<opts.length;i++){
    h+='<button class="'+(DB.daily===opts[i]?'on':'')+'" onclick="setDaily('+opts[i]+')">'+opts[i]+'</button>';
  }
  h+='</div></div>';
  h+='<div class="srow"><div class="lb">自动发音<span class="ds">浏览器没有内置语音时会自动改用在线发音（需要联网）</span></div><button class="switch '+(DB.speak?'on':'')+'" onclick="toggleOpt(\'speak\')"><i></i></button></div>';
  h+='<div class="srow"><div class="lb">显示音标<span class="ds">关闭后卡片更简洁</span></div><button class="switch '+(DB.phon?'on':'')+'" onclick="toggleOpt(\'phon\')"><i></i></button></div>';
  h+='</div>';

  h+='<div class="card"><div class="tagrow"><span class="tag unit">教材同步</span><span class="topic">按课本单元学 / 听写</span></div>';
  var cuS=curUnit();
  if(cuS){
    h+='<div style="font-size:14px;color:#5a6785">当前进度：<b>'+cuS.b.name+'</b> · '+cuS.label+'</div>';
  }else{
    h+='<div style="font-size:14px;color:#8f9ab3">还没有选择当前单元</div>';
  }
  h+='<div class="actions"><button class="btn ghost sm" onclick="go(\'book\')">📚 选教材 / 单元</button></div>';
  h+='</div>';

  h+='<div class="card"><div class="tagrow"><span class="tag">数据备份</span><span class="topic">换电脑/重装浏览器前先导出</span></div>';
  h+='<div class="actions"><button class="btn ghost sm" onclick="exportData()">⬇️ 导出进度</button><button class="btn ghost sm" onclick="importPick()">⬆️ 导入进度</button></div>';
  h+='<input type="file" id="fileinput" accept=".json" style="display:none" onchange="importFile(this)">';
  h+='<div class="footnote" style="text-align:left;padding-top:10px">词库：小学 3–6 年级核心词汇 + 小升初衔接词汇，共 '+WORDS.length+' 词，30 天一个循环。</div>';
  h+='</div>';
  h+='<div class="card"><div class="srow" style="border:none"><div class="lb">清空全部进度<span class="ds">谨慎操作，清空后不可恢复</span></div><button class="btn bad sm" onclick="resetAll()">清空</button></div></div>';
  return h;
}
function setDaily(n){DB.daily=n;save();toast('已设为每天 '+n+' 词');render();}
function toggleOpt(k){DB[k]=!DB[k];save();render();}
function exportData(){
  try{
    var data=JSON.stringify(DB);
    var blob=new Blob([data],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='背单词进度_'+todayStr()+'.json';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);
    toast('已导出');
  }catch(e){toast('导出失败，可换 Chrome 试试');}
}
function importPick(){document.getElementById('fileinput').click();}
function importFile(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(fr.result);
      if(!o||!o.words)throw 0;
      DB=Object.assign(defaultDB(),o);
      save();toast('导入成功');render();
    }catch(e){toast('文件格式不对，导入失败');}
  };
  fr.readAsText(f,'utf-8');
}
function resetAll(){
  if(!confirm('确定清空全部进度吗？这个操作不能撤销。'))return;
  DB=defaultDB();save();toast('已清空');go('home');
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown',function(e){
  if(e.defaultPrevented)return;
  if(view==='study'&&S){
    if(e.key===' '){e.preventDefault();if(!S.flipped)flipCard();}
    else if(e.key==='1'){answer(0);}
    else if(e.key==='2'){answer(1);}
  }
  if(view==='dict'&&DT&&DT.answered&&e.key==='Enter'){e.preventDefault();dictNext();return;}
  if(view==='quiz'&&Q&&Q.answered&&e.key==='Enter'){e.preventDefault();nextQ();return;}
});
if(voiceOK&&window.speechSynthesis){
  try{window.speechSynthesis.onvoiceschanged=function(){};}catch(e){}
}

/* ---------- 启动 ---------- */
DB=loadDB();
if(!DB.plans)DB.plans={};
if(!DB.logs)DB.logs={};
storageOK=checkStorage();
render();
</script>
</body>
